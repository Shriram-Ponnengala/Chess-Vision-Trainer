<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Coordinate Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brown: '#4a2018',     // Brand Dark Brown
              gold: '#c8854a',      // Brand Caramel
              cream: '#fdf0e4',     // Brand Cream
              navy: '#2d4a6b',      // Brand Navy Blue
              white: '#ffffff',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
              'pulse-gold': 'pulse-gold 2s infinite',
              'float': 'float 3s ease-in-out infinite',
              'scale-in': 'scale-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
            keyframes: {
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              },
              'pulse-gold': {
                '0%, 100%': { boxShadow: '0 0 0 0 rgba(230, 177, 126, 0.7)' },
                '50%': { boxShadow: '0 0 0 10px rgba(230, 177, 126, 0)' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              },
              'scale-in': {
                '0%': { transform: 'scale(0.8)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' }
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar to match theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf0e4;
      }
      ::-webkit-scrollbar-thumb {
        background: #c8854a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4a2018;
      }
      /* Clean, flat, coach-grade UI */
      .ui-panel {
        background: #4a2018;
        color: #fdf0e4;
        border: 2px solid #c8854a;
      }
      
      /* Screen Shake & Pulse Animations */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        33% { transform: translateX(-6px); }
        66% { transform: translateX(6px); }
      }
      .shake-effect {
        animation: shake 0.20s cubic-bezier(.36,.07,.19,.97) both;
      }
      
      @keyframes pulse-feedback {
        0% { transform: scale(0.95); opacity: 1; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-feedback {
        animation: pulse-feedback 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes pulse-learn {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.08); opacity: 1; filter: brightness(1.1); }
      }
      .animate-learn {
        animation: pulse-learn 0.2s ease-in-out infinite alternate;
        z-index: 10;
        border: 3px solid #ffaa55 !important;
      }

      /* Enhanced Streak Styles */
      @keyframes glow-caramel {
        0%, 100% {
          box-shadow: 0 0 4px 1px rgba(200, 133, 74, 0.3);
          border-color: rgba(200, 133, 74, 0.4);
        }
        50% {
          box-shadow: 0 0 16px 6px rgba(200, 133, 74, 0.85);
          border-color: rgba(200, 133, 74, 0.9);
        }
      }
      .glow-caramel-aura {
        animation: glow-caramel 1.4s infinite ease-in-out;
      }

      @keyframes fire-flicker {
        0%, 100% { transform: scale(1) rotate(-2deg); filter: brightness(0.95); }
        50% { transform: scale(1.2, 0.85) rotate(3deg); filter: brightness(1.3); }
      }
      .flame-orange {
        animation: fire-flicker 0.22s infinite ease-in-out alternate;
        transform-origin: bottom center;
      }
      .flame-blue {
        animation: fire-flicker 0.16s infinite ease-in-out alternate;
        transform-origin: bottom center;
      }

      @keyframes subtle-vibrate {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-1.5px, 0.5px); }
        40% { transform: translate(1px, -1.5px); }
        60% { transform: translate(-1px, -1px); }
        80% { transform: translate(1.5px, 1px); }
      }
      .animate-subtle-shake {
        animation: subtle-vibrate 0.12s infinite linear;
      }

      @keyframes golden-shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .shimmer-gold-bar {
        position: relative;
        overflow: hidden;
      }
      .shimmer-gold-bar::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(200, 133, 74, 0.15) 35%, rgba(253, 240, 228, 0.3) 50%, rgba(200, 133, 74, 0.15) 65%, transparent);
        background-size: 200% 100%;
        animation: golden-shimmer 3.5s infinite linear;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-cream text-brown h-[100dvh] w-screen overflow-hidden selection:bg-gold selection:text-brown font-sans flex items-center justify-center">
    <div id="root" class="w-full h-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
